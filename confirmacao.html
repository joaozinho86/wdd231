<title>Confirmação | Complexo Eólico Cerro Chato</title>
<meta name="description" content="Confirmação de envio de mensagem para o Complexo Eólico Cerro Chato.">
<meta name="author" content="João [Sobrenome]">

<main>
  <h1>Mensagem Enviada com Sucesso!</h1>
  <div id="dados-formulario"></div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const container = document.querySelector('#dados-formulario');
  let html = '<ul>';
  for (const [key, value] of params) {
    html += `<li><strong>${key}:</strong> ${value}</li>`;
  }
  html += '</ul>';
  container.innerHTML = html;
</script>
